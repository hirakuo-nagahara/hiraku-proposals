<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>田宮石材店 | 大阪府吹田市の墓石・霊園工事</title>
<style>
  :root{
    --stone:#4a5560;
    --stone-deep:#2c333b;
    --moss:#8a9a7a;
    --paper:#f5f6f7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;background:var(--paper);color:#2c333b;line-height:1.8;}
  .notice{background:#fff3d6;color:#8a6d1a;text-align:center;padding:8px;font-size:.8rem;}
  header{background:var(--stone-deep);color:#fff;padding:20px 24px;}
  header .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
  header h1{font-size:1.4rem;letter-spacing:.08em;}
  header .sub{font-size:.75rem;color:var(--moss);letter-spacing:.05em;}
  .hero{background:linear-gradient(135deg,var(--stone) 0%, var(--stone-deep) 100%);color:#fff;padding:64px 24px;text-align:center;}
  .hero h2{font-size:1.7rem;margin-bottom:16px;letter-spacing:.03em;}
  .hero p{max-width:600px;margin:0 auto;font-size:.95rem;opacity:.9;}
  section{max-width:840px;margin:0 auto;padding:44px 20px;}
  h3{color:var(--stone-deep);font-size:1.3rem;margin-bottom:20px;text-align:center;letter-spacing:.05em;}
  h3::after{content:"";display:block;width:36px;height:2px;background:var(--moss);margin:10px auto 0;}
  .services{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .services div{background:#fff;border:1px solid #dde1e4;padding:20px;text-align:center;border-radius:4px;font-size:.9rem;color:var(--stone-deep);font-weight:bold;}
  .info-box{background:#fff;border:1px solid #dde1e4;border-radius:4px;padding:24px;}
  .info-box dt{color:var(--stone-deep);font-weight:bold;margin-top:10px;}
  footer{background:var(--stone-deep);color:#fff;text-align:center;padding:28px 20px;font-size:.8rem;}
</style>
</head>
<body>
<div class="notice">※これはデザイン提案用のサンプルです</div>
<header>
  <div class="top">
    <h1>田宮石材店</h1>
    <span class="sub">大阪府吹田市 墓石・霊園工事</span>
  </div>
</header>
<div class="hero">
  <h2>吹田・北摂地域の墓石・霊園工事は<br>田宮石材店にお任せください</h2>
  <p>吹田市営霊園、豊中市営霊園、吹田市営千里山霊園をはじめ、その他霊園でも幅広く対応しております。</p>
</div>

<section>
  <h3>事業内容</h3>
  <div class="services">
    <div>墓石販売</div>
    <div>墓地施工</div>
    <div>霊園工事</div>
    <div>その他石材工事</div>
  </div>
</section>

<section>
  <h3>店舗情報</h3>
  <div class="info-box">
    <dl>
      <dt>所在地</dt><dd>大阪府吹田市山田西1-1-4</dd>
      <dt>TEL</dt><dd>06-6381-1968</dd>
      <dt>メール</dt><dd>tamiyasekizai@fol.hi-ho.ne.jp</dd>
      <dt>対応霊園</dt><dd>吹田市営霊園、豊中市営霊園、吹田市営千里山霊園、その他霊園</dd>
    </dl>
  </div>
</section>

<footer>
  &copy; 田宮石材店 ｜ 本ページはデザイン提案用サンプルです
